[project]
name = "byomailer"
dynamic = ["version"]
description = "Python client for the BYOMailer API."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "BYOMailer" }]
keywords = ["byomailer", "email", "newsletter", "amazon-ses", "webhooks", "api", "sdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Email",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Repository = "https://github.com/amedina068/byomailer-python"
Changelog = "https://github.com/amedina068/byomailer-python/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/byomailer/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/byomailer"]

[tool.hatch.build.targets.sdist]
include = ["src/byomailer", "tests", "README.md", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: calls a live BYOMailer instance"]
filterwarnings = ["error"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "N", "C4", "RET"]

[tool.ruff.lint.per-file-ignores]
# One table row for each operation reads better than wrapped rows.
"tests/test_resources.py" = ["E501"]
